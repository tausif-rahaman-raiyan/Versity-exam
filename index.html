<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varsity QB — Science Admission Question Bank &amp; Exam Portal (DU, RU, JU, CU, GST)</title>
    <meta name="description" content="DU, RU, JU, CU, GST Science Unit Admission Question Bank with full-page auto-lock strict exam simulation, detailed solutions, and AI doubt solver." />
    <meta property="og:title" content="Varsity QB — Science Admission Question Bank & Exam Portal" />
    <meta property="og:description" content="DU, RU, JU, CU, GST Science Unit Admission Question Bank with full-page auto-lock strict exam simulation, detailed solutions, and AI doubt solver." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            var _protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _protoFetch;
              },
              set: function(fn) {
                _protoFetch = fn;
              }
            });
          } catch (e2) {}
        }

        // Suppress harmless Vite HMR WebSocket errors when HMR is disabled in preview
        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.includes('WebSocket closed without opened') || msg.includes('failed to connect to websocket'))) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        });

        // Intercept and swallow rogue errors injected from third-party browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.includes('chrome-extension://')) ||
            (event && event.message && (event.message.includes('Cannot set property fetch') || event.message.includes('WebSocket closed without opened')))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx" onerror="window.__loadPrebuiltBundle && window.__loadPrebuiltBundle()"></script>
    <script>
      // Automatic fallback loader when GitHub Pages serves raw main branch /(root) directly
      window.__loadPrebuiltBundle = function() {
        if (window.__BUNDLE_LOADED__) return;
        window.__BUNDLE_LOADED__ = true;
        window.__RAW_ROOT_BRANCH__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './dist-bundle/app.css';
        document.head.appendChild(link);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = './dist-bundle/app.js';
        document.body.appendChild(script);
      };
      if (window.location.hostname.indexOf('github.io') !== -1 && document.querySelector('script[src*="src/main.tsx"]')) {
        window.__loadPrebuiltBundle();
      }
    </script>
  </body>
</html>
