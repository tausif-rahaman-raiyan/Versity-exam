    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            var _protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _protoFetch;
              },
              set: function(fn) {
                _protoFetch = fn;
              }
            });
          } catch (e2) {}
        }

        // Intercept and swallow rogue errors injected from third-party browser extensions
        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.includes('chrome-extension://')) ||
            (event && event.message && event.message.includes('Cannot set property fetch'))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
